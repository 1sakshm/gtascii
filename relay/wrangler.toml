# Grand Theft ASCII relay - deploy with: npx wrangler deploy  (from this folder)
name = "gtascii-relay"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

# The Workers Free plan only allows SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Lobby"]
